[package]
name = "lunatic-rust-examples"
version = "0.1.0"
edition = "2021"

[workspace]
# Keep this package separate from the main workspace

[[bin]]
name = "counter"
path = "src/counter.rs"

[[bin]]
name = "echo_server"
path = "src/echo_server.rs"

[[bin]]
name = "gen_server_example"
path = "src/gen_server_example.rs"

[dependencies]
# Add lunatic-otp-patterns for the GenServer example
lunatic-otp-patterns = { path = "../../crates/lunatic-otp-patterns" }
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = "z"  # Optimize for size
lto = true       # Enable Link Time Optimization
strip = true     # Remove debug symbols
