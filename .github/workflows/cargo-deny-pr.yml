name: cargo deny

on:
  push:
    paths:
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - '**/deny.toml'
      - '.github/workflows/cargo-deny-pr.yml'
  pull_request:
    paths:
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - '**/deny.toml'
      - '.github/workflows/cargo-deny-pr.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep advisory output detailed. deny.toml has no advisory exceptions, so every
          # known vulnerability remains a blocking error.
          - checks: advisories
            log_level: info
          - checks: bans licenses sources
            log_level: warn

    steps:
    - uses: actions/checkout@v5
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check
        command-arguments: ${{ matrix.checks }} --show-stats
        log-level: ${{ matrix.log_level }}
