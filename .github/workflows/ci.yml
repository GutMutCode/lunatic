# This workflow does 2 things:
# - For every push & pull request it will run the tests.
# - For every tag it will create a release.
#   The tags must be in the following format: "vX.Y.Z", where X.Y.Z is the release version.

on:
  push:
  pull_request:

name: Test & (release)

jobs:
  test_or_release:
    name: Test & (release)
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: lunatic
            asset_name: lunatic-linux-amd64.tar.gz
            content_type: application/gzip
          - os: macos-15-intel
            target_name: lunatic
            asset_name: lunatic-macos-universal.tar.gz
            content_type: application/gzip
          - os: windows-latest
            target_name: lunatic.exe
            asset_name: lunatic-windows-amd64.zip
            content_type: application/zip
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install latest Rust
        if: runner.os != 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Install latest Rust with an additional AArch64 target on macOS
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt,clippy
      # Rust builds can take some time, cache them.
      - uses: Swatinem/rust-cache@v2
      - name: "Run clippy check"
        run: cargo clippy --examples --tests --benches -- -D warnings
      - name: "Check formatting"
        run: cargo fmt -- --check
      - name: "Verify Windows Wasm lifecycle semantics"
        if: runner.os == 'Windows'
        run: cargo test --test wasm_link_death
      - name: "Run workspace tests and E2E suites"
        run: cargo test --all
      - name: "Run benchmarks (baseline check)"
        if: runner.os == 'Linux'
        run: |
          cargo bench --bench spawn --no-fail-fast -- --output-format bencher | tee benchmark_output.txt
          cargo bench --bench mailbox --no-fail-fast -- --output-format bencher | tee -a benchmark_output.txt
          cargo bench --bench hot_reload --no-fail-fast -- --output-format bencher | tee -a benchmark_output.txt
          cargo bench --bench memory_profile --no-fail-fast -- --output-format bencher | tee -a benchmark_output.txt
          cargo bench --bench instance_pool --no-fail-fast -- --output-format bencher --quick | tee -a benchmark_output.txt
          cargo bench --bench messaging --no-fail-fast -- --output-format bencher --quick | tee -a benchmark_output.txt
          cargo bench --bench distributed_messaging --no-fail-fast -- --output-format bencher --quick | tee -a benchmark_output.txt
          cargo bench --bench distributed_latency --no-fail-fast -- --output-format bencher | tee -a benchmark_output.txt
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat benchmark_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: "Upload benchmark results"
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark_output.txt
          if-no-files-found: error
          retention-days: 30
      - name: "Performance regression check"
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        run: |
          echo "⚠️ Performance regression detection coming soon" >> $GITHUB_STEP_SUMMARY
          echo "Compare benchmark_output.txt with baseline manually for now" >> $GITHUB_STEP_SUMMARY

      - name: "Check benchmark thresholds"
        if: runner.os == 'Linux'
        run: ./scripts/check_bench_thresholds.py

      - name: Build project on Linux and Windows
        if: runner.os != 'macOS'
        run: |
          cargo build --release
          mv ./target/release/${{ matrix.target_name }} ${{ matrix.target_name }}
      - name: Build project on macOs and package into universal binary
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          lipo -create -output lunatic target/aarch64-apple-darwin/release/lunatic target/x86_64-apple-darwin/release/lunatic
      - name: Tar release on Unix
        if: runner.os != 'Windows'
        run: tar czf ${{ matrix.asset_name }} README.md LICENSE-MIT LICENSE-APACHE ${{ matrix.target_name }}
      - name: Zip release on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path README.md,LICENSE-MIT,LICENSE-APACHE,"${{ matrix.target_name }}" -DestinationPath "${{ matrix.asset_name }}"
      - name: Upload packaged release artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-package-${{ matrix.os }}-${{ github.sha }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: test_or_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Download packaged release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-package-*
          path: release-artifacts
          merge-multiple: true
      - name: Get release name
        id: getReleaseName
        shell: bash
        run: echo "RELEASE_NAME=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
      - name: Generate release notes
        shell: bash
        run: |
          awk '/^## v[0-9]+\.[0-9]+\.[0-9]+/ && STATE=="show" { exit }
              STATE=="show";
              /^## ${{ steps.getReleaseName.outputs.RELEASE_NAME }}/ { STATE="catch" }
              /^Released [0-9]+-[0-9]+-[0-9]+/ && STATE=="catch" { STATE="show" }' CHANGELOG.md \
          | awk 'NF { SHOW=1 } SHOW' > RELEASE_NOTES.md
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.getReleaseName.outputs.RELEASE_NAME }}
          name: Lunatic ${{ steps.getReleaseName.outputs.RELEASE_NAME }}
          body_path: RELEASE_NOTES.md
          draft: true
          fail_on_unmatched_files: true
          files: release-artifacts/*
