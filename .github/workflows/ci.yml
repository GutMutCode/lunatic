# This workflow does 2 things:
# - For every push & pull request it will run the tests.
# - For every tag it will create a release.
#   The tags must be in the following format: "vX.Y.Z", where X.Y.Z is the release version.

on:
  push:
  pull_request:

name: Test & (release)

jobs:
  release_contract:
    name: Release contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate workspace versions and changelog contract
        run: python scripts/check_release_contract.py
      - name: Validate core-value evidence and documentation contract
        run: python scripts/check_core_value_docs.py --self-test

  public_api:
    name: Public API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout code and baseline history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select the public API baseline
        id: api_baseline
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GIT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            baseline="$PR_BASE_SHA"
          elif [[ "$GIT_REF" == refs/tags/* ]]; then
            baseline="$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD^ 2>/dev/null || true)"
            if [[ -z "$baseline" ]]; then
              baseline="0b325fb264f005b0a35648e142637e4fb14ad387"
            fi
          else
            baseline="$EVENT_BEFORE"
            if [[ -z "$baseline" || "$baseline" =~ ^0+$ ]]; then
              baseline="$(git merge-base HEAD "origin/$DEFAULT_BRANCH" 2>/dev/null || true)"
            fi
            if [[ -z "$baseline" || "$baseline" == "$(git rev-parse HEAD)" ]]; then
              baseline="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
            if [[ -z "$baseline" ]]; then
              baseline="0b325fb264f005b0a35648e142637e4fb14ad387"
            fi
          fi
          git cat-file -e "${baseline}^{commit}"
          echo "rev=$baseline" >> "$GITHUB_OUTPUT"
      - name: Check workspace SemVer against the selected baseline
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          baseline-rev: ${{ steps.api_baseline.outputs.rev }}
          exclude: lunatic-otp-patterns
          rust-toolchain: "1.94.0"
      - name: Compile the locked 0.13 downstream contract
        run: cargo check --locked --manifest-path tests/fixtures/public-api-0-13/Cargo.toml
      - name: Run the migrated downstream contract
        run: cargo test -p lunatic-process --test public_api_0_13_migration
      - name: Compile the locked 0.14 Rust examples
        run: cargo check --locked --manifest-path examples/rust/Cargo.toml

  spawn_regression:
    name: Paired spawn regression
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout code and baseline history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select the spawn comparison baseline
        id: spawn_baseline
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GIT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Commit that introduced the paired spawn gate with the current fixtures.
          SPAWN_BOOTSTRAP_BASELINE: 4419420e467f65c30f9895d567a702a881abe185
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            baseline="$PR_BASE_SHA"
          elif [[ "$GIT_REF" == refs/tags/* ]]; then
            baseline="$(git rev-parse HEAD^ 2>/dev/null || true)"
          else
            baseline="$EVENT_BEFORE"
            if [[ -z "$baseline" || "$baseline" =~ ^0+$ ]]; then
              baseline="$(git merge-base HEAD "origin/$DEFAULT_BRANCH" 2>/dev/null || true)"
            fi
            if [[ -z "$baseline" || "$baseline" == "$(git rev-parse HEAD)" ]]; then
              baseline="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
          fi
          if [[ -n "$baseline" && ! "$baseline" =~ ^0+$ ]] && \
             ! git cat-file -e "${baseline}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$baseline" || true
          fi
          if [[ -z "$baseline" || "$baseline" =~ ^0+$ ]] || \
             ! git cat-file -e "${baseline}^{commit}" 2>/dev/null; then
            baseline="$(git merge-base HEAD "origin/$DEFAULT_BRANCH" 2>/dev/null || true)"
          fi
          if [[ -z "$baseline" || "$baseline" == "$(git rev-parse HEAD)" ]] || \
             ! git cat-file -e "${baseline}^{commit}" 2>/dev/null; then
            baseline="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [[ -z "$baseline" ]] || ! git cat-file -e "${baseline}^{commit}" 2>/dev/null; then
            echo "Unable to select a spawn benchmark baseline" >&2
            exit 1
          fi
          if ! git cat-file -e "${baseline}:benches/spawn.rs" 2>/dev/null || \
             ! git cat-file -e "${baseline}:wat/hello.wat" 2>/dev/null; then
            if git cat-file -e "${SPAWN_BOOTSTRAP_BASELINE}^{commit}" 2>/dev/null && \
               git merge-base --is-ancestor "$SPAWN_BOOTSTRAP_BASELINE" HEAD && \
               git cat-file -e "${SPAWN_BOOTSTRAP_BASELINE}:benches/spawn.rs" 2>/dev/null && \
               git cat-file -e "${SPAWN_BOOTSTRAP_BASELINE}:wat/hello.wat" 2>/dev/null && \
               git diff --quiet "$SPAWN_BOOTSTRAP_BASELINE" HEAD -- benches/spawn.rs wat/hello.wat; then
              echo "::notice::Selected baseline lacks the spawn parity fixtures; using the stable bootstrap anchor"
              baseline="$SPAWN_BOOTSTRAP_BASELINE"
            fi
          fi
          if ! git cat-file -e "${baseline}:benches/spawn.rs" 2>/dev/null || \
             ! git cat-file -e "${baseline}:wat/hello.wat" 2>/dev/null || \
             ! git diff --quiet "$baseline" HEAD -- benches/spawn.rs wat/hello.wat; then
            echo "Spawn benchmark baseline must contain parity fixtures identical to HEAD" >&2
            exit 1
          fi
          echo "rev=$baseline" >> "$GITHUB_OUTPUT"
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Test the paired comparison policy
        run: python scripts/compare_spawn_bench.py --self-test
      - name: Compare base and head spawn distributions
        run: >-
          python scripts/compare_spawn_bench.py
          "${{ steps.spawn_baseline.outputs.rev }}"
          HEAD
          --output-dir "$RUNNER_TEMP/spawn-comparison"
          --toolchain 1.95.0
          --initial-pairs 10
          --max-pairs 15
          --sample-size 50
          --warm-up-time 1
          --measurement-time 3
      - name: Publish spawn comparison summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/spawn-comparison/summary.md" ]]; then
            cat "$RUNNER_TEMP/spawn-comparison/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload spawn comparison evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spawn-comparison-${{ github.sha }}
          path: ${{ runner.temp }}/spawn-comparison
          if-no-files-found: warn
          retention-days: 30

  multilanguage_guests:
    name: Multi-language guest E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install pinned Rust and core Wasm target
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.5"
          cache-dependency-path: examples/go/go.mod
      - name: Install pinned TinyGo
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --output tinygo.deb \
            https://github.com/tinygo-org/tinygo/releases/download/v0.41.1/tinygo_0.41.1_amd64.deb
          echo "901fbccffc61adb111656d1f907dfc21b6c499ca841b115866a0d6de2d835fbe  tinygo.deb" \
            | sha256sum --check -
          sudo dpkg --install tinygo.deb
          tinygo version | grep -F "tinygo version 0.41.1 "
          "$(tinygo env TINYGOROOT)/bin/wasm-opt" --version | grep -Fx "wasm-opt version 116"
      - name: Install pinned Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.4.1"
          cache: npm
          cache-dependency-path: examples/assemblyscript/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Build the Rust guest from source
        run: |
          cargo +1.94.0 build --locked \
            --manifest-path examples/rust/guest-e2e/Cargo.toml \
            --target wasm32-unknown-unknown \
            --release
      - name: Build the TinyGo guest from source
        run: make -C examples/go guest-e2e
      - name: Build the AssemblyScript guest from source
        run: |
          npm ci --prefix examples/assemblyscript
          npm run --prefix examples/assemblyscript build:guest-e2e
      - name: Build the Lunatic CLI
        run: cargo +1.94.0 build --locked --bin lunatic
      - name: Run every compiler artifact through the public CLI
        shell: bash
        run: |
          timeout 30s ./target/debug/lunatic run \
            examples/rust/guest-e2e/target/wasm32-unknown-unknown/release/lunatic_rust_guest_e2e.wasm
          timeout 30s ./target/debug/lunatic run examples/go/build/guest_e2e.wasm
          timeout 30s ./target/debug/lunatic run examples/assemblyscript/build/guest_e2e.wasm
      - name: Run the strict shared runtime oracle
        env:
          LUNATIC_MULTILANGUAGE_GUESTS_REQUIRED: "1"
        run: cargo +1.94.0 test --test multilanguage_guest_e2e -- --nocapture

  production_evidence:
    name: Production scale and resilience evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Record production evidence environment
        shell: bash
        run: |
          set -o pipefail
          {
            git rev-parse HEAD
            rustc -Vv
            uname -a
            lscpu
            free -b
          } | tee production-environment.txt
      - name: Run actual-Wasm scale, pressure, and bounded-soak gate
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --locked --test wasm_scale_soak \
            actual_wasm_scale_soak_and_resource_pressure_are_bounded \
            -- --exact --nocapture 2>&1 | tee wasm-scale-soak.txt
      - name: Run production live-reload commit and rollback scale gate
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --locked --test live_hot_reload_scale \
            production_hot_reload_scale_soak_preserves_full_mailboxes_and_rolls_back \
            -- --ignored --exact --nocapture 2>&1 | tee live-hot-reload-scale.txt
      - name: Run distributed and crash-recovery resilience gates
        shell: bash
        run: |
          set -o pipefail
          : > production-resilience.txt
          cargo test --release --locked --test distributed_registry_e2e \
            guest_registry_resolves_a_live_remote_mailbox_and_cleans_up_owner_exit \
            -- --exact --nocapture 2>&1 | tee -a production-resilience.txt
          cargo test --release --locked -p lunatic-distributed --test registry_coordination \
            recovered_node_resynchronizes_a_commit_missed_during_partition \
            -- --exact --nocapture 2>&1 | tee -a production-resilience.txt
          cargo test --release --locked -p lunatic-distributed \
            congestion::tests::adversarial_slow_destination_fairness_benchmark \
            -- --exact --nocapture 2>&1 | tee -a production-resilience.txt
          cargo test --release --locked --test wasm_link_death \
            actual_wasm_trap_drives_supervisor_restart_policy \
            -- --exact --nocapture 2>&1 | tee -a production-resilience.txt
      - name: Compare production evidence with core-value claims
        run: >-
          python scripts/check_core_value_docs.py
          --scale-output wasm-scale-soak.txt
          --require-linux-rss
          --live-reload-output live-hot-reload-scale.txt
          --resilience-output production-resilience.txt
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-evidence-${{ github.sha }}
          path: |
            production-environment.txt
            wasm-scale-soak.txt
            live-hot-reload-scale.txt
            production-resilience.txt
          if-no-files-found: error
          retention-days: 30

  test_or_release:
    name: Test & (release)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: lunatic
            asset_name: lunatic-linux-amd64.tar.gz
            content_type: application/gzip
          - os: macos-15-intel
            target_name: lunatic
            asset_name: lunatic-macos-universal.tar.gz
            content_type: application/gzip
          - os: windows-latest
            target_name: lunatic.exe
            asset_name: lunatic-windows-amd64.zip
            content_type: application/zip
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install latest Rust
        if: runner.os != 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Install latest Rust with an additional AArch64 target on macOS
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt,clippy
      # Rust builds can take some time, cache them.
      - uses: Swatinem/rust-cache@v2
      - name: "Run clippy check"
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: "Check formatting"
        run: cargo fmt --all -- --check
      - name: "Verify Windows Wasm lifecycle semantics"
        if: runner.os == 'Windows'
        run: cargo test --test wasm_link_death
      - name: "Run workspace tests and E2E suites"
        run: cargo test --all
      - name: "Run benchmarks (baseline check)"
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          cargo bench --bench spawn --no-fail-fast -- --output-format bencher | tee benchmark_output.txt
          cargo bench --bench mailbox --no-fail-fast -- --output-format bencher | tee -a benchmark_output.txt
          cargo bench --bench hot_reload --no-fail-fast -- --output-format bencher | tee -a benchmark_output.txt
          cargo bench --bench memory_profile --no-fail-fast -- --output-format bencher | tee -a benchmark_output.txt
          cargo bench --bench instance_pool --no-fail-fast -- --output-format bencher | tee -a benchmark_output.txt
          cargo bench --bench messaging --no-fail-fast -- --output-format bencher | tee -a benchmark_output.txt
          cargo bench --bench distributed_messaging --no-fail-fast -- --output-format bencher | tee -a benchmark_output.txt
          cargo bench --bench distributed_latency --no-fail-fast -- --output-format bencher | tee -a benchmark_output.txt
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat benchmark_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: "Upload benchmark results"
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark_output.txt
          if-no-files-found: error
          retention-days: 30
      - name: "Check benchmark thresholds"
        if: runner.os == 'Linux'
        run: ./scripts/check_bench_thresholds.py
      - name: "Compare core-value claims with benchmark evidence"
        if: runner.os == 'Linux'
        run: python scripts/check_core_value_docs.py --benchmark-output benchmark_output.txt

      - name: Build project on Linux and Windows
        if: runner.os != 'macOS'
        run: |
          cargo build --release
          mv ./target/release/${{ matrix.target_name }} ${{ matrix.target_name }}
      - name: Build project on macOs and package into universal binary
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          lipo -create -output lunatic target/aarch64-apple-darwin/release/lunatic target/x86_64-apple-darwin/release/lunatic
      - name: Tar release on Unix
        if: runner.os != 'Windows'
        run: tar czf ${{ matrix.asset_name }} README.md LICENSE-MIT LICENSE-APACHE ${{ matrix.target_name }}
      - name: Zip release on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path README.md,LICENSE-MIT,LICENSE-APACHE,"${{ matrix.target_name }}" -DestinationPath "${{ matrix.asset_name }}"
      - name: Upload packaged release artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-package-${{ matrix.os }}-${{ github.sha }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 30

  release_soak:
    name: Release two-hour production soak
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/production-soak.yml

  release:
    name: Publish draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [public_api, release_contract, spawn_regression, multilanguage_guests, production_evidence, test_or_release, release_soak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Download packaged release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-package-*
          path: release-artifacts
          merge-multiple: true
      - name: Get release name
        id: getReleaseName
        shell: bash
        run: echo "RELEASE_NAME=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
      - name: Generate release notes
        shell: bash
        run: |
          awk '/^## v[0-9]+\.[0-9]+\.[0-9]+/ && STATE=="show" { exit }
              STATE=="show";
              /^## ${{ steps.getReleaseName.outputs.RELEASE_NAME }}/ { STATE="catch" }
              /^Released [0-9]+-[0-9]+-[0-9]+/ && STATE=="catch" { STATE="show" }' CHANGELOG.md \
          | awk 'NF { SHOW=1 } SHOW' > RELEASE_NOTES.md
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.getReleaseName.outputs.RELEASE_NAME }}
          name: Lunatic ${{ steps.getReleaseName.outputs.RELEASE_NAME }}
          body_path: RELEASE_NOTES.md
          draft: true
          fail_on_unmatched_files: true
          files: release-artifacts/*
