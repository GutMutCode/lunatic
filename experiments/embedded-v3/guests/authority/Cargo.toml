[package]
name = "embedded-v3-authority-guests"
version = "0.1.0"
edition = "2018"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
wat = "=1.254.0"

[dev-dependencies]
extism = "=1.30.0"
wasmtime = "=46.0.1"

[[bin]]
name = "build-authority-guests"
path = "src/bin/build_authority_guests.rs"
