[package]
name = "embedded-v3-candidate-extism"
version = "0.1.0"
edition = "2018"
rust-version = "1.85"
publish = false

[workspace]

[dependencies]
anyhow = { version = "=1.0.100", default-features = false, features = ["std"] }
extism = { version = "=1.30.0", default-features = false, features = ["wasmtime-default-features"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }

[[bin]]
name = "embedded-v3-extism"
path = "src/main.rs"
