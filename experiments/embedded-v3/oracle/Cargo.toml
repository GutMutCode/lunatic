[workspace]
members = ["crates/oracle"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2018"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "=1.0.100"
embedded-v3-authority-guests = { path = "../guests/authority" }
extism = "=1.30.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sqlite = { version = "=0.30.4", package = "sqlite-bindings-lunatic" }
thiserror = "=2.0.19"
wasmtime = { version = "=46.0.1", default-features = false, features = ["anyhow", "cranelift", "runtime"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

