[package]
name = "lunatic-otp-patterns"
version = "0.1.0"
edition = "2021"
authors = ["Lunatic Contributors"]
description = "OTP-inspired patterns (GenServer, Supervisor, GenStatem) for Lunatic WASM processes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lunatic-solutions/lunatic"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
bincode = "1.3"
lunatic-process = { path = "../lunatic-process" }
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }
